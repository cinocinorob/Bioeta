name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Test unitari e compilazione APK
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest assembleRelease 2>&1 | tee build.log

      - name: Riporta gli errori di compilazione
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED|AssertionError|Expected|expected:|Exception" build.log | head -60 > errors.txt || true
          i=0
          while IFS= read -r line; do
            i=$((i+1))
            echo "::error title=E$i::${line:0:900}"
          done < errors.txt
          # Dettaglio dei test falliti
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] || continue
            grep -A3 "<failure" "$f" | head -20 | tr '\n' ' ' | sed 's/^/::error title=TEST::/' ; echo
          done

      - name: Rinomina APK e calcola SHA-256
        run: |
          cp app/build/outputs/apk/release/app-release.apk BioEta-${{ github.run_number }}.apk
          sha256sum BioEta-${{ github.run_number }}.apk | tee BioEta-${{ github.run_number }}.apk.sha256
          echo "::notice title=SHA-256::$(cut -d' ' -f1 BioEta-${{ github.run_number }}.apk.sha256)"

      - uses: actions/upload-artifact@v4
        with:
          name: BioEta-apk
          path: |
            BioEta-${{ github.run_number }}.apk
            BioEta-${{ github.run_number }}.apk.sha256

      - name: Pubblica release scaricabile dal telefono
        # Le release si pubblicano solo da main (dopo la revisione della PR), mai dalle PR
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BioEtà build ${{ github.run_number }}
          files: |
            BioEta-${{ github.run_number }}.apk
            BioEta-${{ github.run_number }}.apk.sha256
          make_latest: true

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Rendering schermate
        run: |
          set -o pipefail
          gradle --no-daemon -Pshots recordPaparazziDebug --tests '*Gallery*' 2>&1 | tee shots.log
      - name: Errori rendering
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED|Exception" shots.log | head -40 | while IFS= read -r l; do echo "::error title=SHOT::${l:0:900}"; done
      - name: Pubblica le immagini sul ramo screenshots
        run: |
          mkdir -p /tmp/shots && cp app/src/test/snapshots/images/*.png /tmp/shots/
          cd /tmp/shots
          git init -q -b screenshots
          git config user.name "BioEta CI"; git config user.email "ci@example.invalid"
          git add . && git commit -qm "Schermate build ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" screenshots

  # Verifica su emulatore Android: dati sintetici in Connessione Salute, app reale, screenshot reali.
  device:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Abilita KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compila APK di test
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug assembleDebugAndroidTest 2>&1 | tee compile.log
      - name: Errori di compilazione dei test
        if: failure()
        run: grep -E "^e: |error:|FAILED|What went wrong" -A2 compile.log | head -40 | while IFS= read -r l; do echo "::error title=ATEST::${l:0:900}"; done
      - name: Emulatore Android 15 (Europe/Rome) e test end-to-end
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -timezone Europe/Rome
          script: |
            adb shell mkdir -p /data/local/tmp/bioeta
            gradle --no-daemon connectedDebugAndroidTest > device-test.log 2>&1 || echo failed > device-test-failed.txt
            mkdir -p device-shots
            adb pull /data/local/tmp/bioeta device-shots/ || true
            adb logcat -d -s BioEtaE2E:* AndroidRuntime:E TestRunner:* > device-shots/logcat.txt || true
      - name: Esito e dettagli
        if: always()
        run: |
          ls -R device-shots || true
          grep -E "FAILED|Exception|Error|expected|Tests run|BUILD" device-test.log | head -40 | while IFS= read -r l; do echo "::warning title=DEVICE::${l:0:900}"; done || true
          find app/build/outputs/androidTest-results -name "*.xml" -exec grep -h -A4 "<failure" {} \; | head -30 | tr '\n' ' ' | sed 's/^/::error title=DEVICE_TEST::/' || true
          echo
          if [ -f device-test-failed.txt ]; then echo "::error title=DEVICE::test su emulatore fallito"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-screenshots
          path: |
            device-shots
            device-test.log
      - name: Pubblica gli screenshot del dispositivo
        if: always()
        run: |
          [ -d device-shots ] || exit 0
          mkdir -p /tmp/dev && cp -r device-shots/. /tmp/dev/ && cp device-test.log /tmp/dev/ 2>/dev/null || true
          cd /tmp/dev
          git init -q -b device-screenshots
          git config user.name "BioEta CI"; git config user.email "ci@example.invalid"
          git add . && git commit -qm "Screenshot emulatore run ${{ github.run_number }} (${{ github.sha }})"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" device-screenshots
