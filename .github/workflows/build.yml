name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Test unitari e compilazione APK
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest assembleRelease 2>&1 | tee build.log

      - name: Riporta gli errori di compilazione
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED|AssertionError|Expected|expected:|Exception" build.log | head -60 > errors.txt || true
          i=0
          while IFS= read -r line; do
            i=$((i+1))
            echo "::error title=E$i::${line:0:900}"
          done < errors.txt
          # Dettaglio dei test falliti
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] || continue
            grep -A3 "<failure" "$f" | head -20 | tr '\n' ' ' | sed 's/^/::error title=TEST::/' ; echo
          done

      - name: Rinomina APK e calcola SHA-256
        run: |
          cp app/build/outputs/apk/release/app-release.apk BioEta-${{ github.run_number }}.apk
          sha256sum BioEta-${{ github.run_number }}.apk | tee BioEta-${{ github.run_number }}.apk.sha256
          echo "::notice title=SHA-256::$(cut -d' ' -f1 BioEta-${{ github.run_number }}.apk.sha256)"

      - uses: actions/upload-artifact@v4
        with:
          name: BioEta-apk
          path: |
            BioEta-${{ github.run_number }}.apk
            BioEta-${{ github.run_number }}.apk.sha256

      - name: Pubblica release scaricabile dal telefono
        # Le release si pubblicano solo da main (dopo la revisione della PR), mai dalle PR
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BioEtà build ${{ github.run_number }}
          files: |
            BioEta-${{ github.run_number }}.apk
            BioEta-${{ github.run_number }}.apk.sha256
          make_latest: true

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Rendering schermate
        run: |
          set -o pipefail
          gradle --no-daemon -Pshots recordPaparazziDebug --tests '*Gallery*' 2>&1 | tee shots.log
      - name: Errori rendering
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED|Exception" shots.log | head -40 | while IFS= read -r l; do echo "::error title=SHOT::${l:0:900}"; done
      - name: Pubblica le immagini sul ramo screenshots
        run: |
          mkdir -p /tmp/shots && cp app/src/test/snapshots/images/*.png /tmp/shots/
          cd /tmp/shots
          git init -q -b screenshots
          git config user.name "BioEta CI"; git config user.email "ci@example.invalid"
          git add . && git commit -qm "Schermate build ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" screenshots
